<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin cá nhân - Hệ thống Giáo án</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="alert-box"></div>

    <div class="card">
        <div class="card-header"><h3 class="card-title">Thông tin tài khoản</h3></div>
        <div style="max-width:400px">
            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="profile-username" class="form-control" disabled>
            </div>
            <div class="form-group">
                <label>Quyền hạn (Role)</label>
                <input type="text" id="profile-role" class="form-control" disabled>
            </div>
            <p style="color:var(--text-light); font-size:14px">Để thay đổi mật khẩu, vui lòng liên hệ quản trị viên.</p>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script>
        checkAuth().then(user => {
            if(user) {
                injectLayout('profile', 'Thông tin cá nhân');
                document.getElementById('profile-username').value = user.username;
                document.getElementById('profile-role').value = user.role;
            }
        });
    </script>
</body>
</html>
