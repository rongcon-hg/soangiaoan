<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống Giáo án</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="alert-box"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Hệ thống Giáo án</h2>
            <div class="auth-tabs">
                <div class="auth-tab active" onclick="setAuthMode('login')" id="tab-login">Đăng nhập</div>
                <div class="auth-tab" onclick="setAuthMode('register')" id="tab-register">Đăng ký</div>
            </div>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>Tên đăng nhập</label>
                    <input type="text" id="auth-username" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="auth-password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%" id="auth-btn">Đăng nhập</button>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        let isLoginMode = true;

        // Check if already logged in
        checkAuth(false).then(user => {
            if(user) window.location.href = '/';
        });

        function setAuthMode(mode) {
            isLoginMode = (mode === 'login');
            document.getElementById('tab-login').classList.toggle('active', isLoginMode);
            document.getElementById('tab-register').classList.toggle('active', !isLoginMode);
            document.getElementById('auth-btn').textContent = isLoginMode ? 'Đăng nhập' : 'Đăng ký';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const username = document.getElementById('auth-username').value;
            const password = document.getElementById('auth-password').value;
            const endpoint = isLoginMode ? '/auth/login' : '/auth/register';
            
            try {
                const res = await fetch(API_URL + endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (!res.ok) throw new Error(data.message || data.error);
                
                if (!isLoginMode) {
                    showAlert('Đăng ký thành công, hãy đăng nhập!', 'success');
                    setAuthMode('login');
                    document.getElementById('auth-password').value = '';
                } else {
                    localStorage.setItem('token', data.token);
                    window.location.href = '/';
                }
            } catch (err) {
                showAlert(err.message);
            }
        }
    </script>
</body>
</html>
