<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Người dùng - Hệ thống Giáo án</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="alert-box"></div>

    <div class="card">
        <div class="card-header"><h3 class="card-title">Quản lý Người dùng</h3></div>
        <p>Tính năng này đang được phát triển. Dành riêng cho Admin.</p>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/layout.js"></script>
    <script>
        checkAuth().then(user => {
            if(user) {
                if(user.role !== 'Admin') {
                    window.location.href = '/';
                    return;
                }
                injectLayout('users', 'Quản lý Người dùng');
            }
        });
    </script>
</body>
</html>
